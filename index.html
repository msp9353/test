<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Half Marathon Poster</title>
  <style>
    /* Poster size in pixels approximated for screen (ratio 30w : 20h) */
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .poster {
      width: 900px;  /* proportional to 30 inches */
      height: 600px; /* proportional to 20 inches */
      background: white;
      border: 12px double purple;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .headline {
      font-size: 72px;
      font-weight: 900;
      color: black;
      
      line-height: 1.1;
    }

    .subtext {
      margin-top: 30px;
      font-size: 56px;
      font-weight: 800;
      color: #00a86b; /* green */
      
    }

    
    .corner-doodle {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 6px solid pink;
      border-radius: 20px;
    }
    .top-left { top: 20px; left: 20px; }
    .top-right { top: 20px; right: 20px; }
    .bottom-left { bottom: 20px; left: 20px; }
    .bottom-right { bottom: 20px; right: 20px; }
  </style>
</head>
<body>
  <div class="poster">
    <div class="corner-doodle top-left"></div>
    <div class="corner-doodle top-right"></div>
    <div class="corner-doodle bottom-left"></div>
    <div class="corner-doodle bottom-right"></div>
    <div class="headline">This Park has<br>NO Speed Limit!</div>
    <div class="subtext">Go 다은!</div>
    
  </div>
</body>
</html>
